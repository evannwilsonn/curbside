version: 2
models:
  - name: stg_tlc__trips
    description: Yellow and green trips unioned into one schema. Nothing is filtered here.
    columns:
      - name: service
        data_tests:
          - accepted_values:
              arguments: {values: [yellow, green]}
      - name: file_month
        data_tests: [not_null]
  - name: stg_tlc__zones
    columns:
      - name: zone_id
        data_tests: [unique, not_null]
  - name: stg_weather__daily
    columns:
      - name: weather_date
        data_tests: [unique, not_null]
      - name: precip_in
        data_tests:
          - not_null
          - value_between:
              arguments: {min_value: 0, max_value: 10}
